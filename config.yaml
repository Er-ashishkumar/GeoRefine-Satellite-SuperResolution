paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  models: "models"
  demo_data: "demo_data"

sentinel2:
  red_band: "B4"
  nir_band: "B8"

dataset:
  lr_subdir: "lr"
  hr_subdir: "hr"
  valid_extensions: [".tif", ".tiff"]
  index_filename: "dataset_index.json"
  # Fallback strategy used when no real, independently-sourced HR reference
  # imagery is available for a scene. See data/README.md for details.
  synthetic_hr_fallback:
    enabled: true
    method: "gaussian_blur_downsample"
    blur_sigma: 1.0
    downsample_factor: 4

preprocessing:
  output_index_filename: "preprocessing_index.json"
  synthetic_output_subdir: "synthetic_lr"
  min_overlap_fraction: 0.5
  resolution_ratio_tolerance: 0.15

patches:
  size: 128
  stride: 128
  max_nodata_fraction: 0.1
  output_subdir: "patches"
  index_filename: "patches_index.json"

demo_data_contract:
  input: "input/scene.tif"
  sr: "sr/scene_sr.tif"
  uncertainty: "uncertainty/scene_uncertainty.tif"
  original_ndvi: "ndvi/original_ndvi.tif"
  sr_ndvi: "ndvi/sr_ndvi.tif"
  metrics: "metrics/metrics.json"